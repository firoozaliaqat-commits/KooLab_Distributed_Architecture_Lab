upstream koolab_backends {
    least_conn;
    server app1:8080 max_fails=1 fail_timeout=10s;
    server app2:8080 max_fails=1 fail_timeout=10s;
    server app3:8080 max_fails=1 fail_timeout=10s;
    keepalive 16;
}
limit_req_zone $binary_remote_addr zone=koolab_req:10m rate=100r/s;
server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    proxy_connect_timeout 2s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    location = /grafana { return 301 /grafana/; }
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
        proxy_redirect http://localhost/grafana/ /grafana/;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
    location = /prometheus { return 301 /prometheus/; }
    location /prometheus/ {
        proxy_pass http://prometheus:9090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        limit_req zone=koolab_req burst=250 nodelay;
        proxy_pass http://koolab_backends;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        add_header X-KooLab-Upstream $upstream_addr always;
    }
}
