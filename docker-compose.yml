name: koolab-distributed
x-app-common: &app-common
  image: koolab-distributed-classroom:6.0
  build: .
  restart: unless-stopped
  environment: &app-env
    LAB_DATA: /data
    REDIS_URL: redis://redis:6379/0
    LAB_MODE: classroom
    TRACKER_URL: ${TRACKER_URL:-https://huawei.stackcrm.online}
    TRACKER_LAB_CODE: ${TRACKER_LAB_CODE:-KOOLAB_ELASTIC_SEC}
  volumes:
    - ./data:/data
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 100
  mem_limit: 384m
  cpus: 0.7
  depends_on:
    redis:
      condition: service_healthy
  healthcheck: &app-health
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).read()"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 20s
services:
  app1:
    <<: *app-common
    environment:
      <<: *app-env
      LAB_NODE_ID: app1
  app2:
    <<: *app-common
    environment:
      <<: *app-env
      LAB_NODE_ID: app2
  app3:
    <<: *app-common
    environment:
      <<: *app-env
      LAB_NODE_ID: app3
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      grafana:
        condition: service_started
      prometheus:
        condition: service_started
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    # Nginx master must bind port 80 and switch worker UID/GID.
    # cap_drop ALL without these three capabilities makes proxy restart forever.
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes","--maxmemory","96mb","--maxmemory-policy","noeviction"]
    volumes:
      - redis-data:/data
    mem_limit: 192m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker1:
    image: koolab-distributed-classroom:6.0
    build: .
    command: ["python","-m","app.queue_worker"]
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_ID: worker1
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.3
  worker2:
    image: koolab-distributed-classroom:6.0
    build: .
    command: ["python","-m","app.queue_worker"]
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_ID: worker2
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.3
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.external-url=/prometheus/
    mem_limit: 512m
    cpus: 0.7
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "config", "/etc/prometheus/prometheus.yml"]
      interval: 30s
      timeout: 10s
      retries: 3
  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/seed-dashboards:ro
    depends_on:
      - prometheus
    mem_limit: 512m
    cpus: 0.8
volumes:
  redis-data:
  prometheus-data:
  grafana-data:
